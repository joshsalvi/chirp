<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="934" viewBox="0 0 1300 934"><rect width="1300" height="934" x="0" y="0" fill="#0d1117"/><defs><marker id="arrow1" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow2" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow3" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow4" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow5" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker></defs><text x="650" y="42" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">Adaptive Call-Frequency Audio Enhancement</text><text x="650" y="68" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">The bandpass range is derived from each call&apos;s own spectral content, not a single fixed band applied to every species</text><rect width="1180" height="88" x="60" y="90" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Detection Audio Clip</text><text x="650" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Extracted from the composite recording, with padding before/after the call — its temporal extent is already known</text><line x1="650" x2="650" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect width="1180" height="88" x="60" y="223" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="650" y="261" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Short-Time Fourier Transform</text><text x="650" y="285" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Computed over the full padded clip</text><line x1="650" x2="650" y1="311" y2="350" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect width="578" height="88" x="60" y="356" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="349" y="394" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Noise Floor Estimate</text><text x="349" y="418" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Per-bin median magnitude, from the lowest-energy 20% of frames</text><rect width="578" height="88" x="662" y="356" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="951" y="394" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Per-Bin Signal-to-Noise Ratio</text><text x="951" y="418" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Call-window magnitude ÷ noise floor, for each candidate frequency bin</text><line x1="349" x2="650" y1="444" y2="493" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="951" x2="650" y1="444" y2="493" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect width="1180" height="88" x="60" y="499" fill="#241a35" stroke="#bc8cff" stroke-width="2.5" rx="14"/><text x="650" y="537" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Derive Bandpass Range</text><text x="650" y="561" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Identifies bins that exceed the SNR threshold, takes their min/max frequency + a margin — this range varies per vocalization, not fixed</text><line x1="650" x2="650" y1="587" y2="626" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect width="277" height="99" x="60" y="632" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="198.5" y="675.5" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Edge Taper</text><text x="198.5" y="699.5" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Windowing at clip start/end</text><rect width="277" height="99" x="361" y="632" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="499.5" y="675.5" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Derived-Range Bandpass</text><text x="499.5" y="699.5" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Adaptive, not fixed</text><rect width="277" height="99" x="662" y="632" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="800.5" y="666" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Spectral-Gating Denoise</text><text x="800.5" y="690" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Explicit noise sample when</text><text x="800.5" y="709" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">available</text><rect width="277" height="99" x="963" y="632" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="1101.5" y="666" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Soft Amplitude Limiter</text><text x="1101.5" y="690" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Nonlinear, vs. linear peak</text><text x="1101.5" y="709" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">normalize</text><line x1="198.5" x2="650" y1="731" y2="770" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="499.5" x2="650" y1="731" y2="770" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="800.5" x2="650" y1="731" y2="770" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="1101.5" x2="650" y1="731" y2="770" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect width="1180" height="88" x="60" y="776" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="814" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Enhanced Output Clip</text><text x="650" y="838" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Cached on disk, served alongside the original via a toggle in the web UI</text><text x="650" y="912" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>