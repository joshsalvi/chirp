name: Publish Docker images

# Builds and pushes the full ourchirp.com stack to Docker Hub when a release
# tag (v0.5.14.a, …) is pushed, or by hand from the Actions tab.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with Read & Write). Images go to
# <DOCKERHUB_USERNAME>/chirp, /chirp-headscale and /chirp-caddy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (defaults to chirp-server-instances/VERSION)"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 only for now: arm64 builds under emulation (well over an
          # hour) and hasn't been tested end to end. Unraid is x86_64.
          - image: chirp
            context: chirp-server-instances
            platforms: linux/amd64
            short: "Bird and bat call detection server and web app for Chirp stations (BirdNET)."
          - image: chirp-headscale
            context: chirp-server-instances/headscale
            platforms: linux/amd64,linux/arm64
            short: "Headscale for Chirp: lets stations away from home reach your Chirp server."
          - image: chirp-caddy
            context: chirp-server-instances/caddy
            platforms: linux/amd64,linux/arm64
            short: "Caddy with Cloudflare DNS, giving Chirp Headscale a public HTTPS address."
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ] && V="${GITHUB_REF_NAME#v}"
          [ -z "$V" ] && V="$(cat chirp-server-instances/VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.v.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=https://github.com/joshsalvi/chirp
          cache-from: type=gha,scope=pub-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=pub-${{ matrix.image }}
      # Docker Hub overview from unraid/dockerhub/<image>.md. Needs a token
      # that may edit repositories (Read & Write is enough for most accounts);
      # a failure here doesn't fail the release.
      - uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          readme-filepath: unraid/dockerhub/${{ matrix.image }}.md
          short-description: ${{ matrix.short }}
