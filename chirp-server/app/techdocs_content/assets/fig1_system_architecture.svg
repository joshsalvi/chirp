<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1992" viewBox="0 0 1300 1992"><rect width="1300" height="1992" x="0" y="0" fill="#0d1117"/><defs><marker id="arrow1" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow2" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow3" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow4" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow5" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow6" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow7" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow8" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow9" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow10" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow11" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow12" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow13" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker></defs><text x="650" y="42" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">Overall System Architecture</text><text x="650" y="68" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">Edge sensor node captures and screens audio locally; the server stores, enriches, and serves it</text><rect width="578" height="88" x="60" y="90" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="349" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">USB Microphones</text><text x="349" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">1–4 channels</text><rect width="578" height="88" x="662" y="90" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="951" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Coral EdgeTPU (optional)</text><text x="951" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Hardware neural accelerator</text><line x1="349" x2="650" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="951" x2="650" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect width="1180" height="88" x="60" y="223" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="261" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Dual-Path Audio Subsystem</text><text x="650" y="285" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">SNR-weighted merge for recording · primary-device-only for detection</text><line x1="650" x2="650" y1="311" y2="350" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect width="578" height="88" x="60" y="356" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="349" y="394" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Stage 1 — Energy Filter</text><text x="349" y="418" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">RMS energy + bandpass, cheap pre-screen</text><rect width="578" height="88" x="662" y="356" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="951" y="394" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Stage 2 — BirdNET Classifier</text><text x="951" y="418" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Neural species classifier (TFLite)</text><line x1="349" x2="650" y1="444" y2="483" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="951" x2="650" y1="444" y2="483" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect width="1180" height="88" x="60" y="489" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="650" y="527" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Pre-Roll Buffer</text><text x="650" y="551" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">5s rolling window, so the start of a call is never missed</text><line x1="650" x2="650" y1="577" y2="616" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect width="1180" height="88" x="60" y="622" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="660" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Recording Engine + Uploader</text><text x="650" y="684" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Composite WAV + JSON metadata → server</text><line x1="650" x2="650" y1="710" y2="749" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect width="1180" height="88" x="60" y="755" fill="#21262d" stroke="#8b949e" stroke-width="2.5" rx="14"/><text x="650" y="793" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Edge Hardware</text><text x="650" y="817" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Raspberry Pi 5 · NVMe storage</text><line x1="650" x2="650" y1="843" y2="897" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow6)"/><rect width="1180" height="88" x="60" y="903" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="941" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Network — HTTPS / WebSocket</text><text x="650" y="965" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Recordings, live status, and config sync all travel over this link</text><line x1="650" x2="650" y1="991" y2="1030" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow7)"/><rect width="1180" height="88" x="60" y="1036" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="1074" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">FastAPI REST + WebSocket</text><text x="650" y="1098" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Authentication · recordings · bird profiles · device management</text><line x1="650" x2="650" y1="1124" y2="1163" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow8)"/><rect width="578" height="88" x="60" y="1169" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="349" y="1207" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">SQLite Database</text><text x="349" y="1231" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Recordings · species · devices · settings</text><rect width="578" height="88" x="662" y="1169" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="951" y="1207" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">File Storage</text><text x="951" y="1231" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">WAV · Opus · spectrogram PNGs · media</text><line x1="349" x2="650" y1="1257" y2="1296" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow9)"/><line x1="951" x2="650" y1="1257" y2="1296" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow9)"/><rect width="578" height="88" x="60" y="1302" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="349" y="1340" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Spectrogram Generator</text><text x="349" y="1364" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">librosa + matplotlib, with detection overlays</text><rect width="578" height="88" x="662" y="1302" fill="#2e1f22" stroke="#f85149" stroke-width="2.5" rx="14"/><text x="951" y="1340" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Server BirdNET</text><text x="951" y="1364" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Second-opinion re-analysis (TFLite, CPU)</text><line x1="349" x2="650" y1="1390" y2="1429" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow10)"/><line x1="951" x2="650" y1="1390" y2="1429" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow10)"/><rect width="1180" height="88" x="60" y="1435" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="650" y="1473" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Species Enrichment Pipeline</text><text x="650" y="1497" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Wikipedia · iNaturalist · eBird · Xeno-canto · BirdLife</text><line x1="650" x2="650" y1="1523" y2="1562" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow11)"/><rect width="1180" height="88" x="60" y="1568" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="650" y="1606" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Range Map Engine</text><text x="650" y="1630" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Cornell AAB · iNaturalist geomodel · BirdLife</text><line x1="650" x2="650" y1="1656" y2="1695" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow12)"/><rect width="1180" height="88" x="60" y="1701" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="1739" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">React Progressive Web App</text><text x="650" y="1763" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Dashboard · recordings · life list · bird library · devices · settings</text><line x1="650" x2="650" y1="1789" y2="1828" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow13)"/><rect width="1180" height="88" x="60" y="1834" fill="#21262d" stroke="#8b949e" stroke-width="2.5" rx="14"/><text x="650" y="1872" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Browser / iOS</text><text x="650" y="1896" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Installable, works on desktop and mobile</text><text x="650" y="1970" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>