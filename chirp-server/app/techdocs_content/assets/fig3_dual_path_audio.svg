<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="924" viewBox="0 0 1300 924"><rect x="0" y="0" width="1300" height="924" fill="#0d1117"/><defs><marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker></defs><text x="650.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e6edf3" text-anchor="middle">Dual-Path Audio Acquisition</text><text x="650.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa5b1" text-anchor="middle">Detection and recording read from the same buffer but process it differently, so a weak secondary mic never dilutes the signal BirdNET actually analyzes</text><rect x="60.0" y="90.0" width="277.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="198.5" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Primary Mic (ReSpeaker)</text><text x="198.5" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">48 kHz mono</text><rect x="361.0" y="90.0" width="277.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="499.5" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">USB Mic 2</text><text x="499.5" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">48 kHz mono</text><rect x="662.0" y="90.0" width="277.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="800.5" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">USB Mic 3</text><text x="800.5" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">48 kHz mono</text><rect x="963.0" y="90.0" width="277.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="1101.5" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">USB Mic N …</text><text x="1101.5" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">48 kHz mono</text><line x1="198.5" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="499.5" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="800.5" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="1101.5" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect x="60.0" y="223.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Per-Device Sample Buffer</text><text x="650.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">50ms chunks, circular — one thread-safe buffer per input device</text><line x1="650.0" y1="311.0" x2="650.0" y2="350.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect x="60.0" y="356.0" width="560.0" height="99.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="340.0" y="399.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Path A — Detection</text><text x="340.0" y="423.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Primary stream only: the single highest-SNR channel, unaltered</text><rect x="644.0" y="356.0" width="560.0" height="99.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="924.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Path B — Recording</text><text x="924.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">SNR-weighted merge of every channel: whichever mic dominates the signal</text><text x="924.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">contributes most, automatically</text><line x1="340.0" y1="455.0" x2="650.0" y2="494.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="924.0" y1="455.0" x2="650.0" y2="494.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="60.0" y="500.0" width="560.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="340.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">BirdNET Analysis Window</text><text x="340.0" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">3s overlapping chunks · species ID + confidence</text><rect x="644.0" y="500.0" width="560.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="924.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">5-Second Pre-Roll Buffer</text><text x="924.0" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Continuously overwritten ring buffer, so a call&#39;s onset is always captured</text><line x1="340.0" y1="588.0" x2="650.0" y2="627.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><line x1="924.0" y1="588.0" x2="650.0" y2="627.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="60.0" y="633.0" width="560.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="340.0" y="671.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Detection Queue</text><text x="340.0" y="695.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Triggers recording once confidence clears the threshold</text><rect x="644.0" y="633.0" width="560.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="924.0" y="671.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Composite WAV Output</text><text x="924.0" y="695.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Pre-roll + trigger window + post-roll, full-quality stereo file</text><line x1="340.0" y1="721.0" x2="650.0" y2="760.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="924.0" y1="721.0" x2="650.0" y2="760.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect x="60.0" y="766.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="804.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Upload Engine</text><text x="650.0" y="828.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Detection metadata (Path A) + audio file (Path B) → multipart POST to server</text><text x="650.0" y="902" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>