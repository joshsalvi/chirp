 TOPS, 0.5W — optional neural accelerator</text><rect x="662.0" y="356.0" width="578.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="951.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">NVMe / MicroSD</text><text x="951.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Local WAV cache, auto-delete policy</text><line x1="349.0" y1="444.0" x2="650.0" y2="483.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="951.0" y1="444.0" x2="650.0" y2="483.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="60.0" y="489.0" width="578.0" height="88.0" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/><text x="349.0" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">SSD1306 OLED Display</text><text x="349.0" y="551.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">I²C · status readout · GPIO button</text><rect x="662.0" y="489.0" width="578.0" height="88.0" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/><text x="951.0" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Network</text><text x="951.0" y="551.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Ethernet or WiFi, self-reports LAN IP</text><line x1="349.0" y1="577.0" x2="650.0" y2="626.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><line x1="951.0" y1="577.0" x2="650.0" y2="626.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="60.0" y="632.0" width="1180.0" height="88.0" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/><text x="650.0" y="670.0" font-family="Helvetica, Arial, sans-serif" font-si