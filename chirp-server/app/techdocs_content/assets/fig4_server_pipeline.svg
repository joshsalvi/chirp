<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1067" viewBox="0 0 1300 1067"><rect x="0" y="0" width="1300" height="1067" fill="#0d1117"/><defs><marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker></defs><text x="650.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e6edf3" text-anchor="middle">Server-Side Processing Pipeline</text><text x="650.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa5b1" text-anchor="middle">Three background tasks run in parallel on every upload, then a purge gate decides what&#39;s kept</text><rect x="60.0" y="90.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Recording Upload Endpoint</text><text x="650.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">POST /api/v1/recordings/upload · API-key auth · multipart WAV + JSON sidecar, size-validated</text><line x1="650.0" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect x="60.0" y="223.0" width="377.3" height="99.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="248.7" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Spectrogram Generation</text><text x="248.7" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">librosa mel-scale render, detection overlays →</text><text x="248.7" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">PNG cache</text><rect x="461.3" y="223.0" width="377.3" height="99.0" rx="14" fill="#2e1f22" stroke="#f85149" stroke-width="2.5"/><text x="650.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Server BirdNET Re-Analysis</text><text x="650.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">TFLite CPU · lat/lon + date filtering ·</text><text x="650.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">second-opinion confidence</text><rect x="862.7" y="223.0" width="377.3" height="99.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="1051.3" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Species Enrichment</text><text x="1051.3" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Wikipedia · iNaturalist · eBird · Xeno-canto ·</text><text x="1051.3" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">range maps (first sighting only)</text><line x1="248.7" y1="322.0" x2="650.0" y2="371.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><line x1="650.0" y1="322.0" x2="650.0" y2="371.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><line x1="1051.3" y1="322.0" x2="650.0" y2="371.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect x="60.0" y="377.0" width="1180.0" height="88.0" rx="14" fill="#2e1f22" stroke="#f85149" stroke-width="2.5"/><text x="650.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Auto-Purge Gate</text><text x="650.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Zero server detections AND device confidence below threshold? Delete entirely, or audio-only (keep the DB row)</text><line x1="650.0" y1="465.0" x2="650.0" y2="504.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="60.0" y="510.0" width="578.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="349.0" y="548.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Retained</text><text x="349.0" y="572.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">WAV → Opus/FLAC (4–50% of original size) · spectrogram + detection rows kept</text><rect x="662.0" y="510.0" width="578.0" height="88.0" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/><text x="951.0" y="548.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Purged</text><text x="951.0" y="572.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Audio deleted; DB row optionally kept for history</text><line x1="349.0" y1="598.0" x2="650.0" y2="637.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><line x1="951.0" y1="598.0" x2="650.0" y2="637.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="60.0" y="643.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="681.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">WebSocket Broadcast</text><text x="650.0" y="705.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Real-time JSON event pushed to every connected browser — no polling, sub-second latency</text><line x1="650.0" y1="731.0" x2="650.0" y2="770.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect x="60.0" y="776.0" width="1180.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="650.0" y="814.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">SQLite Persistent Store</text><text x="650.0" y="838.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">recordings · detections · bird_profiles · regional_species · app_settings · devices · users</text><line x1="650.0" y1="864.0" x2="650.0" y2="903.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow6)"/><rect x="60.0" y="909.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="947.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">REST API + PWA</text><text x="650.0" y="971.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Recordings · spectrograms · clips · bird profiles · life list · devices · auth · changelog</text><text x="650.0" y="1045" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>