# ReadTheDocs build configuration.
# This repo/project should be kept PRIVATE on ReadTheDocs (requires a paid
# RTD plan for private projects) — this documentation describes the
# patent-pending detection pipeline in technical detail and must not be
# publicly indexed while the patent is unfiled. See PATENT_APPLICATION.md.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: techdocs/mkdocs.yml

python:
  install:
    - requirements: techdocs/requirements.txt
