<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1179" viewBox="0 0 1200 1179"><rect width="1200" height="1179" x="0" y="0" fill="#0d1117"/><defs><marker id="arrow1" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow2" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow3" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow4" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow5" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow6" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow7" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker></defs><text x="600" y="42" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">Two-Stage Detection Pipeline</text><text x="600" y="68" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">A cheap energy pre-filter screens out silence before the expensive neural classifier ever runs</text><rect width="1000" height="88" x="100" y="90" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="600" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">USB Microphone Array</text><text x="600" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">1–4 devices, 48 kHz stereo</text><line x1="600" x2="600" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect width="1000" height="88" x="100" y="223" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="600" y="261" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Dual-Path Audio Merge</text><text x="600" y="285" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">DETECT: primary device only · RECORD: SNR-weighted all-channel mix</text><line x1="600" x2="600" y1="311" y2="350" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect width="1000" height="88" x="100" y="356" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="600" y="394" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Circular Pre-Roll Buffer</text><text x="600" y="418" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Rolling 5s window, continuously written</text><line x1="600" x2="600" y1="444" y2="483" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect width="1000" height="88" x="100" y="489" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="600" y="527" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Stage 1 — Energy Filter</text><text x="600" y="551" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">RMS window 500ms · threshold −85 dBFS · bandpass 250–12,000 Hz (Butterworth)</text><text x="80" y="537" fill="#d29922" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="end">STAGE 1</text><line x1="600" x2="600" y1="577" y2="616" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect width="1000" height="88" x="100" y="622" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="600" y="660" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Stage 2 — BirdNET Classifier</text><text x="600" y="684" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">3s analysis window · TFLite · Coral EdgeTPU if present (~20ms vs ~300ms CPU)</text><text x="80" y="670" fill="#d29922" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="end">STAGE 2</text><line x1="600" x2="600" y1="710" y2="749" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect width="1000" height="88" x="100" y="755" fill="#2e1f22" stroke="#f85149" stroke-width="2.5" rx="14"/><text x="600" y="793" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Confidence ≥ Threshold?</text><text x="600" y="817" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Default 0.05, configurable per deployment</text><line x1="600" x2="600" y1="843" y2="882" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow6)"/><rect width="1000" height="88" x="100" y="888" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="600" y="926" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Recording Engine</text><text x="600" y="950" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Prepends 5s pre-roll + trigger window + configurable post-roll → composite WAV</text><line x1="600" x2="600" y1="976" y2="1015" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow7)"/><rect width="1000" height="88" x="100" y="1021" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="600" y="1059" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Upload Queue → Server</text><text x="600" y="1083" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Multipart POST with JSON metadata · exponential-backoff retry · local cache</text><text x="600" y="1157" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>