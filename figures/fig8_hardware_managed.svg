df3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Server Re-Analysis</text><text x="650" y="1241" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Second-opinion BirdNET pass, lat/lon + date filtering</text><line x1="650" x2="650" y1="1267" y2="1306" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow9)"/><rect width="1180" height="88" x="60" y="1312" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="650" y="1350" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">SSH Terminal (in-browser)</text><text x="650" y="1374" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">WebSocket → paramiko PTY → xterm.js, 256-color</text><line x1="650" x2="650" y1="1400" y2="1439" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow10)"/><rect width="1180" height="88" x="60" y="1445" fill="#21262d" stroke="#8b949e" stroke-width="2.5" rx="14"/><text x="650" y="1483" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">config.yaml on device</text><text x="650" y="1507" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">e.g. detection_source: primary · disable_agc_on_start: true</text><text x="650" y="1581" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>