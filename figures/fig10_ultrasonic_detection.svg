<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="934" viewBox="0 0 1300 934"><rect x="0" y="0" width="1300" height="934" fill="#0d1117"/><defs><marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker></defs><text x="650.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e6edf3" text-anchor="middle">Ultrasonic Bat Echolocation Detection</text><text x="650.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa5b1" text-anchor="middle">An entirely independent audio path — no species ID is attempted, and it runs alongside the bird pipeline without interference</text><rect x="60.0" y="90.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Second Microphone, ≥192 kHz Sample Rate</text><text x="650.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">A completely separate audio path from the 48kHz bird-detection pipeline</text><line x1="650.0" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect x="60.0" y="223.0" width="1180.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="650.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Analysis Windows</text><text x="650.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Short-time Fourier transform over the candidate ultrasonic band, fixed-duration successive windows</text><line x1="650.0" y1="311.0" x2="650.0" y2="350.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect x="60.0" y="356.0" width="377.3" height="99.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="248.7" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Rolling Noise Floor</text><text x="248.7" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Exponentially-weighted lower percentile,</text><text x="248.7" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">per-window energy</text><rect x="461.3" y="356.0" width="377.3" height="99.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="650.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Pulse Identification</text><text x="650.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Contiguous frames above threshold ratio, 1–25ms</text><text x="650.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">duration</text><rect x="862.7" y="356.0" width="377.3" height="99.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="1051.3" y="399.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Frequency-Sweep Classifier</text><text x="1051.3" y="423.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">FM vs. non-FM, from per-frame dominant frequency</text><line x1="248.7" y1="455.0" x2="650.0" y2="504.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="650.0" y1="455.0" x2="650.0" y2="504.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="1051.3" y1="455.0" x2="650.0" y2="504.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="60.0" y="510.0" width="1180.0" height="88.0" rx="14" fill="#241a35" stroke="#bc8cff" stroke-width="2.5"/><text x="650.0" y="548.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Event Aggregation</text><text x="650.0" y="572.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Requires several pulses within a sliding time window — rejects isolated noise clicks; outputs pulse count, median peak frequency, mean duration, swept fraction</text><line x1="650.0" y1="598.0" x2="650.0" y2="637.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="60.0" y="643.0" width="560.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="340.0" y="681.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Device-Local: Time-Expanded WAV</text><text x="340.0" y="705.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">10x slowdown, saved locally — audible without the server</text><rect x="644.0" y="643.0" width="560.0" height="88.0" rx="14" fill="#2e1f22" stroke="#f85149" stroke-width="2.5"/><text x="924.0" y="681.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Server Upload: Raw Audio + Stats</text><text x="924.0" y="705.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Authenticated, independent of bird-recording uploads</text><line x1="340.0" y1="731.0" x2="650.0" y2="770.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="924.0" y1="731.0" x2="650.0" y2="770.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect x="60.0" y="776.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="814.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Server: On-Demand Frequency Downshift</text><text x="650.0" y="838.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Retags raw samples at a reduced nominal rate (no resampling) — a Raw/Enhanced toggle, user-selectable in the web UI</text><text x="650.0" y="912" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>