<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><rect x="0" y="0" width="1500" height="760" fill="#0d1117"/><text x="750.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e6edf3" text-anchor="middle">Location-Aware Species Likelihood Scoring</text><text x="750.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa5b1" text-anchor="middle">How a flagged detection gets a plausibility label, combining regional records with the device's own recent history</text><text x="50" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start">Score computation</text><rect x="50" y="134" width="630" height="46" rx="10" fill="#2c2611" stroke="#d29922" stroke-width="2"/><text x="365.0" y="164" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e3b341" text-anchor="middle">L(s) = 0.50·E(s) + 0.40·D(s) + 0.10·R(s)</text><rect x="50" y="210" width="630" height="86" rx="12" fill="#2c2611" stroke="#d29922" stroke-width="2.3"/><text x="68" y="238" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#d29922" text-anchor="start">E(s) — Regional Observations · weight 0.50</text><text x="68" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="start">eBird sightings within 50km over the last 30 days,</text><text x="68" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="start">with distance decay d(r) = e^(−r/r₀)</text><rect x="50" y="314" width="630" height="86" rx="12" fill="#132e21" stroke="#3fb950" stroke-width="2.3"/><text x="68" y="342" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3fb950" text-anchor="start">D(s) — Local Detection History · weight 0.40</text><text x="68" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="start">This device&#39;s own detections over the past 90 days,</text><text x="68" y="383" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="start">normalized to its max local count</text><rect x="50" y="418" width="630" height="68" rx="12" fill="#172a3f" stroke="#58a6ff" stroke-width="2.3"/><text x="68" y="446" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="start">R(s) — Recency Bonus · weight 0.10</text><text x="68" y="468" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="start">Linear decay: 1.0 today → 0 at 90 days</text><rect x="50" y="504" width="630" height="86" rx="12" fill="#2e1f22" stroke="#f85149" stroke-width="2.3"/><text x="68" y="532" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f85149" text-anchor="start">Categorical label</text><text x="68" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="start">≥0.70 Very Likely · 0.40–0.69 Likely</text><text x="68" y="573" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="start">0.15–0.39 Possible · &lt;0.15 Rare</text><text x="1110.0" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Monthly frequency example</text><text x="1110.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9aa5b1" text-anchor="middle">eBird species-trends + iNaturalist histogram, composited</text><line x1="790" y1="630.0" x2="1440" y2="630.0" stroke="#30363d" stroke-width="1"/><text x="780" y="634.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="end">0.0</text><line x1="790" y1="534.0" x2="1440" y2="534.0" stroke="#30363d" stroke-width="1"/><text x="780" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="end">0.2</text><line x1="790" y1="438.0" x2="1440" y2="438.0" stroke="#30363d" stroke-width="1"/><text x="780" y="442.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="end">0.4</text><line x1="790" y1="342.0" x2="1440" y2="342.0" stroke="#30363d" stroke-width="1"/><text x="780" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="end">0.6</text><line x1="790" y1="246.0" x2="1440" y2="246.0" stroke="#30363d" stroke-width="1"/><text x="780" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="end">0.8</text><line x1="790" y1="150.0" x2="1440" y2="150.0" stroke="#30363d" stroke-width="1"/><text x="780" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="end">1.0</text><line x1="790" y1="294.0" x2="1440" y2="294.0" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,4"/><line x1="790" y1="438.0" x2="1440" y2="438.0" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="799.8" y="620.4" width="34.7" height="9.6" fill="#58a6ff" opacity="0.88"/><text x="817.1" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Jan</text><rect x="853.9" y="610.8" width="34.7" height="19.2" fill="#58a6ff" opacity="0.88"/><text x="871.2" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Feb</text><rect x="908.1" y="558.0" width="34.7" height="72.0" fill="#58a6ff" opacity="0.88"/><text x="925.4" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Mar</text><rect x="962.2" y="255.6" width="34.7" height="374.4" fill="#58a6ff" opacity="0.88"/><text x="979.6" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Apr</text><rect x="1016.4" y="174.0" width="34.7" height="456.0" fill="#58a6ff" opacity="0.88"/><text x="1033.8" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">May</text><rect x="1070.6" y="207.6" width="34.7" height="422.4" fill="#3fb950" opacity="0.88"/><text x="1087.9" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Jun</text><text x="1087.9" y="199.6" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">current month</text><rect x="1124.8" y="284.4" width="34.7" height="345.6" fill="#58a6ff" opacity="0.88"/><text x="1142.1" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Jul</text><rect x="1178.9" y="390.0" width="34.7" height="240.0" fill="#58a6ff" opacity="0.88"/><text x="1196.2" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Aug</text><rect x="1233.1" y="510.0" width="34.7" height="120.0" fill="#58a6ff" opacity="0.88"/><text x="1250.4" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Sep</text><rect x="1287.2" y="606.0" width="34.7" height="24.0" fill="#58a6ff" opacity="0.88"/><text x="1304.6" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Oct</text><rect x="1341.4" y="620.4" width="34.7" height="9.6" fill="#58a6ff" opacity="0.88"/><text x="1358.7" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Nov</text><rect x="1395.6" y="625.2" width="34.7" height="4.8" fill="#58a6ff" opacity="0.88"/><text x="1412.9" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1" text-anchor="middle">Dec</text><line x1="790" y1="150" x2="790" y2="630" stroke="#8b949e" stroke-width="1.3"/><line x1="790" y1="630" x2="1440" y2="630" stroke="#8b949e" stroke-width="1.3"/><line x1="1290" y1="156" x2="1315" y2="156" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,4"/><text x="1322" y="160" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1">Very Likely (0.70)</text><line x1="1290" y1="174" x2="1315" y2="174" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6,4"/><text x="1322" y="178" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa5b1">Likely (0.40)</text><text x="750.0" y="738" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>