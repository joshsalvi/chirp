is (TFLite, CPU)</text><line x1="349.0" y1="1390.0" x2="650.0" y2="1429.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow10)"/><line x1="951.0" y1="1390.0" x2="650.0" y2="1429.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow10)"/><rect x="60.0" y="1435.0" width="1180.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="650.0" y="1473.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Species Enrichment Pipeline</text><text x="650.0" y="1497.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Wikipedia · iNaturalist · eBird · Xeno-canto · BirdLife</text><line x1="650.0" y1="1523.0" x2="650.0" y2="1562.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow11)"/><rect x="60.0" y="1568.0" width="1180.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="650.0" y="1606.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Range Map Engine</text><text x="650.0" y="1630.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Cornell AAB · iNaturalist geomodel · BirdLife</text><line x1="650.0" y1="1656.0" x2="650.0" y2="1695.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow12)"/><rect x="60.0" y="1701.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="1739.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">React Progressive Web App</text><text x="650.0" y="1763.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Dashboard · recordings · life list · bird library · devices · settings</text><line x1="650.0" y1="1789.0" x2="650.0" y2="1828.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow13)"/><rect x="60.0" y="1834.0" width="1180.0" height="88.0" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/><text x="650.0" y="1872.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Browser / iOS</text><text x="650.0" y="1896.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Installable, works on desktop and mobile</text><text x="650.0" y="1970" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>