<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1992" viewBox="0 0 1300 1992"><rect x="0" y="0" width="1300" height="1992" fill="#0d1117"/><defs><marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow8" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow9" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow10" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow11" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow12" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow13" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker></defs><text x="650.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e6edf3" text-anchor="middle">Overall System Architecture</text><text x="650.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa5b1" text-anchor="middle">Edge sensor node captures and screens audio locally; the server stores, enriches, and serves it</text><rect x="60.0" y="90.0" width="578.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="349.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">USB Microphones</text><text x="349.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">1–4 channels</text><rect x="662.0" y="90.0" width="578.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="951.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Coral EdgeTPU (optional)</text><text x="951.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Hardware neural accelerator</text><line x1="349.0" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="951.0" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect x="60.0" y="223.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Dual-Path Audio Subsystem</text><text x="650.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">SNR-weighted merge for recording · primary-device-only for detection</text><line x1="650.0" y1="311.0" x2="650.0" y2="350.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect x="60.0" y="356.0" width="578.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="349.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Stage 1 — Energy Filter</text><text x="349.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">RMS energy + bandpass, cheap pre-screen</text><rect x="662.0" y="356.0" width="578.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="951.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Stage 2 — BirdNET Classifier</text><text x="951.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Neural species classifier (TFLite)</text><line x1="349.0" y1="444.0" x2="650.0" y2="483.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="951.0" y1="444.0" x2="650.0" y2="483.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="60.0" y="489.0" width="1180.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="650.0" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Pre-Roll Buffer</text><text x="650.0" y="551.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">5s rolling window, so the start of a call is never missed</text><line x1="650.0" y1="577.0" x2="650.0" y2="616.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="60.0" y="622.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="660.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Recording Engine + Uploader</text><text x="650.0" y="684.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Composite WAV + JSON metadata → server</text><line x1="650.0" y1="710.0" x2="650.0" y2="749.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect x="60.0" y="755.0" width="1180.0" height="88.0" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/><text x="650.0" y="793.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Edge Hardware</text><text x="650.0" y="817.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Raspberry Pi 5 · NVMe storage</text><line x1="650.0" y1="843.0" x2="650.0" y2="897.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow6)"/><rect x="60.0" y="903.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="941.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Network — HTTPS / WebSocket</text><text x="650.0" y="965.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Recordings, live status, and config sync all travel over this link</text><line x1="650.0" y1="991.0" x2="650.0" y2="1030.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow7)"/><rect x="60.0" y="1036.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="1074.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">FastAPI REST + WebSocket</text><text x="650.0" y="1098.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Authentication · recordings · bird profiles · device management</text><line x1="650.0" y1="1124.0" x2="650.0" y2="1163.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arro