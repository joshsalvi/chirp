<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="924" viewBox="0 0 1300 924"><rect width="1300" height="924" x="0" y="0" fill="#0d1117"/><defs><marker id="arrow1" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow2" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow3" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow4" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker><marker id="arrow5" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#8b949e" d="M0,0 L6,3 L0,6 Z"/></marker></defs><text x="650" y="42" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">Dual-Path Audio Acquisition</text><text x="650" y="68" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">Detection and recording read from the same buffer but process it differently, so a weak secondary mic never dilutes the signal BirdNET actually analyzes</text><rect width="277" height="88" x="60" y="90" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="198.5" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Primary Mic (ReSpeaker)</text><text x="198.5" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">48 kHz mono</text><rect width="277" height="88" x="361" y="90" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="499.5" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">USB Mic 2</text><text x="499.5" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">48 kHz mono</text><rect width="277" height="88" x="662" y="90" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="800.5" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">USB Mic 3</text><text x="800.5" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">48 kHz mono</text><rect width="277" height="88" x="963" y="90" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="1101.5" y="128" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">USB Mic N …</text><text x="1101.5" y="152" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">48 kHz mono</text><line x1="198.5" x2="650" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="499.5" x2="650" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="800.5" x2="650" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><line x1="1101.5" x2="650" y1="178" y2="217" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect width="1180" height="88" x="60" y="223" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="261" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Per-Device Sample Buffer</text><text x="650" y="285" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">50ms chunks, circular — one thread-safe buffer per input device</text><line x1="650" x2="650" y1="311" y2="350" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect width="560" height="99" x="60" y="356" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="340" y="399.5" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Path A — Detection</text><text x="340" y="423.5" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Primary stream only: the single highest-SNR channel, unaltered</text><rect width="560" height="99" x="644" y="356" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="924" y="390" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Path B — Recording</text><text x="924" y="414" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">SNR-weighted merge of every channel: whichever mic dominates the signal</text><text x="924" y="433" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">contributes most, automatically</text><line x1="340" x2="650" y1="455" y2="494" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="924" x2="650" y1="455" y2="494" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect width="560" height="88" x="60" y="500" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="340" y="538" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">BirdNET Analysis Window</text><text x="340" y="562" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">3s overlapping chunks · species ID + confidence</text><rect width="560" height="88" x="644" y="500" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="924" y="538" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">5-Second Pre-Roll Buffer</text><text x="924" y="562" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Continuously overwritten ring buffer, so a call&apos;s onset is always captured</text><line x1="340" x2="650" y1="588" y2="627" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><line x1="924" x2="650" y1="588" y2="627" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect width="560" height="88" x="60" y="633" fill="#2c2611" stroke="#d29922" stroke-width="2.5" rx="14"/><text x="340" y="671" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Detection Queue</text><text x="340" y="695" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Triggers recording once confidence clears the threshold</text><rect width="560" height="88" x="644" y="633" fill="#132e21" stroke="#3fb950" stroke-width="2.5" rx="14"/><text x="924" y="671" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Composite WAV Output</text><text x="924" y="695" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Pre-roll + trigger window + post-roll, full-quality stereo file</text><line x1="340" x2="650" y1="721" y2="760" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="924" x2="650" y1="721" y2="760" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect width="1180" height="88" x="60" y="766" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5" rx="14"/><text x="650" y="804" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Upload Engine</text><text x="650" y="828" fill="#9aa5b1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Detection metadata (Path A) + audio file (Path B) → multipart POST to server</text><text x="650" y="902" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>