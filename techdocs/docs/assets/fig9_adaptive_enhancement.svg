<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="934" viewBox="0 0 1300 934"><rect x="0" y="0" width="1300" height="934" fill="#0d1117"/><defs><marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker></defs><text x="650.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e6edf3" text-anchor="middle">Adaptive Call-Frequency Audio Enhancement</text><text x="650.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa5b1" text-anchor="middle">The bandpass range is derived from each call&#39;s own spectral content, not a single fixed band applied to every species</text><rect x="60.0" y="90.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Detection Audio Clip</text><text x="650.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Extracted from the composite recording, with padding before/after the call — its temporal extent is already known</text><line x1="650.0" y1="178.0" x2="650.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect x="60.0" y="223.0" width="1180.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="650.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Short-Time Fourier Transform</text><text x="650.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Computed over the full padded clip</text><line x1="650.0" y1="311.0" x2="650.0" y2="350.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect x="60.0" y="356.0" width="578.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="349.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Noise Floor Estimate</text><text x="349.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Per-bin median magnitude, from the lowest-energy 20% of frames</text><rect x="662.0" y="356.0" width="578.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="951.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Per-Bin Signal-to-Noise Ratio</text><text x="951.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Call-window magnitude ÷ noise floor, for each candidate frequency bin</text><line x1="349.0" y1="444.0" x2="650.0" y2="493.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="951.0" y1="444.0" x2="650.0" y2="493.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="60.0" y="499.0" width="1180.0" height="88.0" rx="14" fill="#241a35" stroke="#bc8cff" stroke-width="2.5"/><text x="650.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Derive Bandpass Range</text><text x="650.0" y="561.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Identifies bins that exceed the SNR threshold, takes their min/max frequency + a margin — this range varies per vocalization, not fixed</text><line x1="650.0" y1="587.0" x2="650.0" y2="626.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="60.0" y="632.0" width="277.0" height="99.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="198.5" y="675.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Edge Taper</text><text x="198.5" y="699.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Windowing at clip start/end</text><rect x="361.0" y="632.0" width="277.0" height="99.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="499.5" y="675.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Derived-Range Bandpass</text><text x="499.5" y="699.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Adaptive, not fixed</text><rect x="662.0" y="632.0" width="277.0" height="99.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="800.5" y="666.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Spectral-Gating Denoise</text><text x="800.5" y="690.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Explicit noise sample when</text><text x="800.5" y="709.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">available</text><rect x="963.0" y="632.0" width="277.0" height="99.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="1101.5" y="666.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Soft Amplitude Limiter</text><text x="1101.5" y="690.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Nonlinear, vs. linear peak</text><text x="1101.5" y="709.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">normalize</text><line x1="198.5" y1="731.0" x2="650.0" y2="770.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="499.5" y1="731.0" x2="650.0" y2="770.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="800.5" y1="731.0" x2="650.0" y2="770.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><line x1="1101.5" y1="731.0" x2="650.0" y2="770.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect x="60.0" y="776.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="814.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Enhanced Output Clip</text><text x="650.0" y="838.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Cached on disk, served alongside the original via a toggle in the web UI</text><text x="650.0" y="912" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>