<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1179" viewBox="0 0 1200 1179"><rect x="0" y="0" width="1200" height="1179" fill="#0d1117"/><defs><marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker><marker id="arrow7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/></marker></defs><text x="600.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e6edf3" text-anchor="middle">Two-Stage Detection Pipeline</text><text x="600.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa5b1" text-anchor="middle">A cheap energy pre-filter screens out silence before the expensive neural classifier ever runs</text><rect x="100.0" y="90.0" width="1000.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="600.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">USB Microphone Array</text><text x="600.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">1–4 devices, 48 kHz stereo</text><line x1="600.0" y1="178.0" x2="600.0" y2="217.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow1)"/><rect x="100.0" y="223.0" width="1000.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="600.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Dual-Path Audio Merge</text><text x="600.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">DETECT: primary device only · RECORD: SNR-weighted all-channel mix</text><line x1="600.0" y1="311.0" x2="600.0" y2="350.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect x="100.0" y="356.0" width="1000.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="600.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Circular Pre-Roll Buffer</text><text x="600.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Rolling 5s window, continuously written</text><line x1="600.0" y1="444.0" x2="600.0" y2="483.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="100.0" y="489.0" width="1000.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="600.0" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Stage 1 — Energy Filter</text><text x="600.0" y="551.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">RMS window 500ms · threshold −85 dBFS · bandpass 250–12,000 Hz (Butterworth)</text><text x="80" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#d29922" text-anchor="end">STAGE 1</text><line x1="600.0" y1="577.0" x2="600.0" y2="616.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="100.0" y="622.0" width="1000.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="600.0" y="660.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Stage 2 — BirdNET Classifier</text><text x="600.0" y="684.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">3s analysis window · TFLite · Coral EdgeTPU if present (~20ms vs ~300ms CPU)</text><text x="80" y="670.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#d29922" text-anchor="end">STAGE 2</text><line x1="600.0" y1="710.0" x2="600.0" y2="749.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect x="100.0" y="755.0" width="1000.0" height="88.0" rx="14" fill="#2e1f22" stroke="#f85149" stroke-width="2.5"/><text x="600.0" y="793.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Confidence ≥ Threshold?</text><text x="600.0" y="817.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Default 0.05, configurable per deployment</text><line x1="600.0" y1="843.0" x2="600.0" y2="882.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow6)"/><rect x="100.0" y="888.0" width="1000.0" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="600.0" y="926.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Recording Engine</text><text x="600.0" y="950.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Prepends 5s pre-roll + trigger window + configurable post-roll → composite WAV</text><line x1="600.0" y1="976.0" x2="600.0" y2="1015.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow7)"/><rect x="100.0" y="1021.0" width="1000.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="600.0" y="1059.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Upload Queue → Server</text><text x="600.0" y="1083.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Multipart POST with JSON metadata · exponential-backoff retry · local cache</text><text x="600.0" y="1157" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>