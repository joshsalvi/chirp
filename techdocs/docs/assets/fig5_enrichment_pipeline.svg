 sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Wikipedia</text><text x="168.4" y="290.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Article summary, section</text><text x="168.4" y="309.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">parsing</text><rect x="300.8" y="223.0" width="216.8" height="118.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="409.2" y="266.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">iNaturalist API</text><text x="409.2" y="290.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Primary photo, extra</text><text x="409.2" y="309.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">photos, taxon ID</text><rect x="541.6" y="223.0" width="216.8" height="118.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="650.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Cornell eBird API</text><text x="650.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Species code, taxonomy,</text><text x="650.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">family/order, year-round</text><text x="650.0" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">species list</text><rect x="782.4" y="223.0" width="216.8" height="118.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="890.8" y="266.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Xeno-canto API</text><text x="890.8" y="290.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Call recordings, quality</text><text x="890.8" y="309.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">grade, type labels</text><rect x="1023.2" y="223.0" width="216.8" height="118.0" rx="14" fill="#2e1f22" stroke="#f85149" stroke-width="2.5"/><text x="1131.6" y="266.5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">BirdLife / GBIF</text><text x="1131.6" y="290.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Range map, conservation</text><text x="1131.6" y="309.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">status, IUCN category</text><line x1="168.4" y1="341.0" x2="650.0" y2="390.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><line x1="409.2" y1="341.0" x2="650.0" y2="390.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><line x1="650.0" y1="341.0" x2="650.0" y2="390.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><line x1="890.8" y1="341.0" x2="650.0" y2="390.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><line x1="1131.6" y1="341.0" x2="650.0" y2="390.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow2)"/><rect x="60.0" y="396.0" width="377.3" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="248.7" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">AAB / Cornell (range map)</text><text x="248.7" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Headless-browser capture, lazy-load intercept</text><rect x="461.3" y="396.0" width="377.3" height="88.0" rx="14" fill="#132e21" stroke="#3fb950" stroke-width="2.5"/><text x="650.0" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">iNaturalist Geomodel (range map)</text><text x="650.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Local GeoPackage, H3 hex grid, rendered locally</text><rect x="862.7" y="396.0" width="377.3" height="88.0" rx="14" fill="#2e1f22" stroke="#f85149" stroke-width="2.5"/><text x="1051.3" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">BirdLife / IUCN (range map)</text><text x="1051.3" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Headless-browser capture, legend dismissal</text><line x1="248.7" y1="484.0" x2="650.0" y2="523.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="650.0" y1="484.0" x2="650.0" y2="523.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><line x1="1051.3" y1="484.0" x2="650.0" y2="523.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow3)"/><rect x="60.0" y="529.0" width="1180.0" height="88.0" rx="14" fill="#2c2611" stroke="#d29922" stroke-width="2.5"/><text x="650.0" y="567.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Bird Profile Cache (SQLite)</text><text x="650.0" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">Description · photo · call media · monthly frequency · conservation status · range map URL</text><line x1="650.0" y1="617.0" x2="650.0" y2="656.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow4)"/><rect x="60.0" y="662.0" width="1180.0" height="88.0" rx="14" fill="#172a3f" stroke="#58a6ff" stroke-width="2.5"/><text x="650.0" y="700.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Bird Profile API</text><text x="650.0" y="724.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">GET /api/v1/birds/{id} — range map served with source-appropriate legend; falls back AAB → Geomodel → BirdLife → Wikipedia if a source fails</text><line x1="650.0" y1="750.0" x2="650.0" y2="789.0" stroke="#8b949e" stroke-width="2.2" marker-end="url(#arrow5)"/><rect x="60.0" y="795.0" width="1180.0" height="88.0" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/><text x="650.0" y="833.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Periodic Re-Enrichment</text><text x="650.0" y="857.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa5b1" text-anchor="middle">30-day TTL · background refresh · force-refreshable via POST /api/v1/birds/{id}/enrich</text><text x="650.0" y="931" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">CHIRP — Automated Wildlife Vocalization Detection System | © 2026 Joshua Salvi</text></svg>